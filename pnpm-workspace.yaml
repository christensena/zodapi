packages:
  - packages/*
  - examples/*

minimumReleaseAge: 0

allowBuilds:
  esbuild: true

# Shared dependency ranges. Packages reference these with `catalog:`.
catalog:
  '@hono/node-server': ^2.1.1
  '@hono/zod-openapi': ^1.6.1
  '@types/node': ^26.4.0
  axios: ^1.20.0
  hono: ^4.13.5
  tsx: ^4.23.12
  zod: ^4.4.3

catalogs:
  # Deliberately wider ranges for published peerDependencies.
  peers:
    '@hono/zod-openapi': ^1.6.0
    axios: ^1.0.0
    hono: '>=4.10.0'
    zod: ^4.0.0
