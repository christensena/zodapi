name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the job proves its identity to npm via OIDC.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version packages" PR from the pending changesets,
      # then publishes once that PR lands. No npm token: pnpm exchanges the
      # Actions OIDC token per package, and adds provenance automatically.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
