name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version packages" PR from the pending changesets.
      # Publishing stays local: `pnpm changeset:publish` prompts for the npm OTP.
      - uses: changesets/action@v2
        with:
          version: pnpm changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
